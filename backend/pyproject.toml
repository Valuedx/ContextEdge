[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextedge"
version = "0.1.0"
description = "Operational Memory and Living Playbook Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "pgvector>=0.3",
    "redis>=5.2",
    "celery[redis]>=5.4",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "authlib>=1.4",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
    "cryptography>=44",
    "boto3>=1.35",
    "litellm>=1.55",
    "structlog>=24.4",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "testcontainers[postgres,redis]>=4.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/contextedge"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
