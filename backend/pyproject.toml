[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextedge"
version = "0.1.0"
description = "Operational Memory and Living Playbook Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "pgvector>=0.5",
    "redis>=5.2,<=5.2.1",
    "celery[redis]>=5.4",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4,<4.1",
    "authlib>=1.4",
    "httpx>=0.28",
    "python-multipart>=0.0.18",
    "cryptography>=44",
    "boto3>=1.35",
    "google-auth>=2.29",
    "litellm>=1.55",
    # MMR similarity math in search/chunk_rollup.py (production search
    # path) — declared explicitly; it was previously only transitive.
    "numpy>=1.26",
    "structlog>=24.4",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
maf = [
    "agent-framework-core>=1.12,<2",
]
# Structured parsing for uploaded SOPs / runbooks (services/documents).
# Optional so a base install still ingests logs, JSON, and transcripts —
# the parser registry degrades to "unsupported format" rather than
# failing at import.
#
# pdfplumber (MIT, over pdfminer.six) is used INSTEAD OF PyMuPDF/fitz.
# PyMuPDF is faster with better layout analysis and is licensed
# "Dual Licensed - GNU AFFERO GPL 3.0 or Artifex Commercial License" —
# AGPL obligations or a paid licence, neither of which this product
# should take on for a parsing adapter. Do not add it.
documents = [
    "pdfplumber>=0.11",
    "python-docx>=1.1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "testcontainers[postgres,redis]>=4.8",
    # Keep the MAF adapter tests (test_maf_adapter.py importorskips
    # agent_framework) running in dev/CI instead of silently skipping.
    "agent-framework-core>=1.12,<2",
    # Same reason for the document tests: they importorskip pdfplumber
    # and reportlab, so without these the PDF suite goes green by
    # skipping rather than by passing.
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "reportlab>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/contextedge"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# N818: the four pre-existing exception classes without an Error suffix
# (ApprovalPolicyViolation, TenantBudgetExceeded,
# CredentialEncryptionUnavailable, DestructiveResetBlocked) are released
# API — renaming breaks catch sites. New exceptions follow the suffix
# convention (enforced in review, not by rule).
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is data: wrapping long prompt lines risks altering the
# exact strings sent to the model, and eval baselines pin those strings.
"src/contextedge/ai/prompts/*" = ["E501"]
# Seed scripts carry long demo-content strings — data, not code.
"src/contextedge/demo_maf_seed.py" = ["E501"]
"src/contextedge/reset_db_and_seed.py" = ["E501"]
# Module docstring holds a markdown table whose rows exceed the limit;
# wrapping would break the table.
"src/contextedge/services/chunkers/attachment.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
