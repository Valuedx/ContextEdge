# Continuous integration for ContextEdge.
#
# Two required jobs (backend-tests, frontend-tests) and one advisory
# lint job. The full backend suite runs WITHOUT live services — every
# test uses fakes/mocks for PostgreSQL, Redis, MinIO, and the LLM
# provider — so CI needs no service containers and stays fast.
#
# Lint is continue-on-error because the codebase carries pre-existing
# ruff debt (367 findings at introduction; see KNOWN_GAPS). Making it
# required before that debt is paid would turn every PR red for
# unrelated reasons. Flip it to required once the debt is cleared.

name: CI

on:
  push:
    branches:
      - main
      - feature/maf-context-graph-integration
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend with dev extras
        run: pip install -e .[dev]
      - name: Run test suite
        run: pytest tests -q

  frontend-tests:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 to match the verified-green local environment — the jsdom/
          # undici stack in the lockfile needs util.markAsUncloneable,
          # which Node 20 on the runner lacks (first CI run failed on it).
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test

  lint:
    # --exit-zero keeps this job green while still emitting inline
    # annotations: a continue-on-error job would show a red ✗ on every
    # PR's check list even though the workflow passes — permanent noise.
    # A real ruff crash (not findings) still fails the job, as it should.
    name: Ruff (advisory — pre-existing debt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.8"
      - name: Ruff check (advisory)
        run: ruff check src --output-format=github --exit-zero
