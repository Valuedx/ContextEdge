# Continuous integration for ContextEdge.
#
# Three required jobs: backend tests, frontend tests, and ruff. The full backend suite runs WITHOUT live services — every
# test uses fakes/mocks for PostgreSQL, Redis, MinIO, and the LLM
# provider — so CI needs no service containers and stays fast.
#
# All three jobs are required. Lint became a gate after the 2026-08
# debt cleanup (367 findings → 0); deliberate exceptions are documented
# in backend/pyproject.toml per-file-ignores with their reasons.

name: CI

on:
  push:
    branches:
      - main
      - feature/maf-context-graph-integration
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend with dev extras
        run: pip install -e .[dev]
      - name: Run test suite
        run: pytest tests -q

  frontend-tests:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 to match the verified-green local environment — the jsdom/
          # undici stack in the lockfile needs util.markAsUncloneable,
          # which Node 20 on the runner lacks (first CI run failed on it).
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test

  lint:
    # Required gate since the 2026-08 lint-debt cleanup: the codebase is
    # ruff-clean (deliberate exceptions live in pyproject with reasons).
    name: Ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.8"
      - name: Ruff check
        run: ruff check src --output-format=github
